name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests
        run: dotnet test tests/WordTableToExcel.Tests -c Release

      - name: Compilation du complément (.NET Framework 4.0, AnyCPU)
        run: dotnet build src/WordTableToExcel -c Release

      - name: Paquet d'installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/WordTableToExcel | Out-Null
          Copy-Item src/WordTableToExcel/bin/Release/net40/WordTableToExcel.dll dist/WordTableToExcel/
          Copy-Item scripts/* dist/WordTableToExcel/
          Copy-Item README.md dist/WordTableToExcel/LISEZMOI.md

      - name: Diagnostic enregistrement HKCU (temporaire)
        continue-on-error: true
        shell: powershell
        run: ./tests/ci/hkcu-experiment.ps1 -Dist dist/WordTableToExcel

      - name: Test d'installation et d'activation COM (32 et 64 bits)
        shell: powershell
        run: ./tests/ci/com-smoke-test.ps1 -Dist dist/WordTableToExcel

      - uses: actions/upload-artifact@v4
        with:
          name: WordTableToExcel
          path: dist/WordTableToExcel
